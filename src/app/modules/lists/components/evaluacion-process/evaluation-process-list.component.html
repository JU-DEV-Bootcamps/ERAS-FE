@if (!displayV2()) {
  <h1 class="page-title">Evaluation Processes</h1>
}

@if (this.totalEvaluations !== 0) {
  <div align="end" class="button-add-evaluation">
    <app-eras-button
      [textButton]="'Add new'"
      [iconButton]="'add'"
      (clickButton)="openModalNewEvaluationProcess()"
    ></app-eras-button>
  </div>
}

<app-list
  (loadCalled)="handleLoadCalled($event)"
  (actionCalled)="handleActionCalled($event)"
  [columns]="columns"
  [columnTemplates]="columnTemplates"
  [items]="evaluationProcessList"
  [totalItems]="totalEvaluations"
  [actionDatas]="actionDatas"
>
  <ng-template #status let-element>
    @if (displayV2()) {
      <span
        [matTooltip]="getStatusTooltip(element.status)"
        [style.backgroundColor]="getStatusColor(element.status)"
        [style.color]="getStatusLabelColor(element.status)"
        class="badge"
      >
        {{ getStatusLabel(element.status) }}
      </span>
    } @else {
      <app-badge-status [element]="element" />
    }
  </ng-template>
</app-list>

@if (this.totalEvaluations === 0) {
  <section align="center">
    <app-eras-button
      [textButton]="'Let\'s create a new one!'"
      (clickButton)="openModalNewEvaluationProcess()"
    ></app-eras-button>
  </section>
}
