<div class="modal-header">
  <h2 mat-dialog-title>{{ title }}</h2>
  <mat-icon (click)="requestClose()">close</mat-icon>
</div>

<div class="modal-content">
  <mat-dialog-content>
    <div class="form-body">
      <app-form-factory
        [fields]="formFields"
        (formReady)="setFormGroup($event)"
      ></app-form-factory>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button
      type="button"
      class="cancel-button"
      [disabled]="isSubmitting()"
      (click)="requestClose()"
    >
      {{ messages.CANCEL }}
    </button>
    <button
      class="action-button"
      type="submit"
      [ngClass]="{ 'disabled-button': isSubmitting() }"
      [disabled]="isSubmitting()"
      (click)="submit()"
    >
      {{ submitLabel() }}
    </button>
  </mat-dialog-actions>
</div>
