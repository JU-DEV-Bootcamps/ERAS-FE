<div class="profile-modal">
  @if (isLoading()) {
    <div class="state"><mat-spinner diameter="40" /></div>
  } @else if (hasError() || !profile()) {
    <p class="state error">{{ messages.LOAD_ERROR }}</p>
  } @else {
    <app-student-profile-view
      [profile]="profile()!"
      [studentId]="data.studentId"
      interventionsMode="read"
    />
  }
</div>
<div class="actions">
  <button type="button" class="close-button" mat-dialog-close>
    {{ messages.CLOSE }}
  </button>
</div>
