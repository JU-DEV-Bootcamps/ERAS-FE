<section class="import-status">
  <header class="import-status__header">
    <button mat-stroked-button (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
      Back
    </button>

    <div class="import-status__summary" *ngIf="status as s">
      <app-import-status-badge [status]="s.status"></app-import-status-badge>
      <span class="counts">{{ progressLabel }}</span>
    </div>

    <!-- Confirm selection (extraction done) -->
    <button
      *ngIf="isReady"
      mat-flat-button
      color="primary"
      (click)="confirmImport()"
      [disabled]="confirmableCount === 0"
    >
      <mat-icon>cloud_upload</mat-icon>
      Import selected ({{ confirmableCount }})
    </button>

    <!-- Retry failed (import phase) -->
    <button
      *ngIf="!isExtractionPhase"
      mat-flat-button
      color="primary"
      (click)="retrySelected()"
      [disabled]="selectedFailedCount === 0"
    >
      <mat-icon>refresh</mat-icon>
      Retry selected ({{ selectedFailedCount }})
    </button>
  </header>

  <mat-progress-bar
    *ngIf="showProgress"
    [mode]="progressMode"
    [value]="progressValue"
  ></mat-progress-bar>

  <app-table-with-actions
    [items]="rows"
    [columns]="columns"
    [columnTemplates]="statusColumns"
    [templateMap]="templateMap"
    [actionDatas]="actions"
    [itemsAreSelectable]="true"
    [isItemDisabled]="isItemDisabled"
    (actionCalled)="onAction($event)"
  ></app-table-with-actions>
</section>

<ng-template #statusTpl let-row>
  <app-import-status-badge [status]="row.status"></app-import-status-badge>
</ng-template>
