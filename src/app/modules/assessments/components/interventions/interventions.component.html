<div class="container">
  <app-list-filters
    [filterFields]="filters()"
    (appliedFilters)="handleFilters($event)"
  ></app-list-filters>

  <app-intervention-list
    #interventionList
    [appliedFilters]="appliedFilters()"
    [assessmentIdInput]="selectedAssessmentId()"
    [studentNamesLookup]="studentNamesLookup()"
    (createClicked)="openCreateModal()"
    (editClicked)="openEditModal($event)"
    (deleteClicked)="confirmDelete($event)"
  />
</div>
