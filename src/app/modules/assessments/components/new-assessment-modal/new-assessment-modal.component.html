<div class="modal-header">
  <h2 mat-dialog-title>New Assessment</h2>
  <mat-icon (click)="requestClose()">close</mat-icon>
</div>
<div class="modal-content">
  <mat-dialog-content>
    <app-form-factory
      [fields]="formFields"
      (formReady)="setFormGroup($event)"
    ></app-form-factory>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button
      type="button"
      class="cancel-button"
      [disabled]="isSubmitting"
      (click)="requestClose()"
    >
      Cancel
    </button>
    <button
      class="action-button"
      type="submit"
      [ngClass]="{ 'disabled-button': form.invalid || form.pristine }"
      [disabled]="form.invalid || form.pristine || isSubmitting"
      (click)="submitAssessment()"
    >
      {{ isSubmitting ? 'Creating...' : 'Create' }}
    </button>
  </mat-dialog-actions>
</div>
