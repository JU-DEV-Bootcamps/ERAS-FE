<div class="container">
  <div class="section-profile">
    @if (isEditing()) {
      <app-profile-edit-form (saved)="onSaved()" (cancelled)="stopEdit()" />
    } @else {
      <app-profile-card (edit)="startEdit()" />
    }
  </div>

  @if (isProfessional()) {
    <div class="section-professional">
      @if (isEditingProfessional()) {
        <app-professional-info-edit-form
          (saved)="stopEditProfessional()"
          (cancelled)="stopEditProfessional()"
        />
      } @else {
        <app-professional-info
          [activeInterventions]="
            summaryProfile()?.activeInterventionsCount ?? 0
          "
          (edit)="startEditProfessional()"
        />
      }
    </div>
  } @else {
    <div class="section-summary">
      <app-profile-summary [profile]="summaryProfile()" />
    </div>
  }
</div>
