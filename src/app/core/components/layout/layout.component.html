<mat-sidenav-container (backdropClick)="menuOpen.set(false)">
  <mat-sidenav
    #sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="isMobile() ? menuOpen() : true"
    [disableClose]="!isMobile()"
    (closedStart)="menuOpen.set(false)"
    [style.width]="sidenavWidth()"
    [ngClass]="newSidebar() ? 'new-theme' : 'old-theme'"
  >
    <button
      *ngIf="!newSidebar() && !isMobile()"
      class="expand-button"
      mat-icon-button
      (click)="collapsed.set(!collapsed())"
    >
      <mat-icon class="menu-icon">{{
        collapsed() ? 'menu' : 'menu_open'
      }}</mat-icon>
    </button>

    <app-sidebar
      [(collapsed)]="collapsed"
      [newSidebar]="newSidebar()"
    ></app-sidebar>
  </mat-sidenav>

  <mat-sidenav-content [style.margin-left]="contentMargin()">
    <app-header-container (menuToggle)="menuOpen.set(!menuOpen())" />
    <div class="container" [class.mobile]="isMobile()">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

<app-toast-notification></app-toast-notification>
