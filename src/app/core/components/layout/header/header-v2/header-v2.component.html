<mat-toolbar [class.mobile]="isMobile()">
  @if (isMobile()) {
    <button
      type="button"
      mat-icon-button
      class="menu-button"
      [attr.aria-label]="messages.OPEN_MENU"
      (click)="menuToggle.emit()"
    >
      <mat-icon>menu</mat-icon>
    </button>
  }
  <h1 class="app-title">{{ sectionTitle }}</h1>
  <div class="profile-section">
    @if (!isMobile()) {
      <div class="user-info">
        <span class="user-name"
          >{{ user()?.firstName }} {{ user()?.lastName }}</span
        >
        <span class="user-role">{{ user()?.role }}</span>
      </div>
      <mat-icon [ariaSetSize]="36">notifications_none</mat-icon>
    }
    <app-user-menu></app-user-menu>
  </div>
</mat-toolbar>
